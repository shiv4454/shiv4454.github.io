<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Shiv Shankar</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#05070f;--text:#f2f4fb;--muted:#a2aac2;--muted-2:#6f7891;
    --blue:#3b82f6;--violet:#8b5cf6;
    --accent-grad:linear-gradient(135deg,var(--blue) 0%,var(--violet) 100%);
    --border:rgba(255,255,255,.09);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    font-family:var(--font);color:var(--text);line-height:1.65;text-align:center;padding:32px;
    background:
      radial-gradient(900px 600px at 15% -10%, rgba(59,130,246,.20), transparent 60%),
      radial-gradient(800px 600px at 85% 10%, rgba(139,92,246,.18), transparent 62%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;width:100%}
  .mark{width:56px;height:56px;border-radius:15px;background:var(--accent-grad);
    display:grid;place-items:center;font-weight:800;font-size:1.05rem;margin:0 auto 34px;
    box-shadow:0 14px 34px -12px rgba(99,102,241,1)}
  .code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.74rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    color:#c7d2fe;background:rgba(99,102,241,.12);border:1px solid rgba(147,163,255,.28);
    padding:7px 16px;border-radius:999px;display:inline-block;
  }
  h1{font-size:clamp(2.1rem,7vw,3.2rem);margin:24px 0 0;letter-spacing:-.04em;line-height:1.1;font-weight:700}
  .grad-text{background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent}
  p{margin:18px auto 0;color:var(--muted);max-width:44ch;font-size:1.02rem}
  .actions{margin-top:36px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;
    padding:14px 26px;border-radius:999px;font-weight:600;font-size:.95rem;text-decoration:none;
    border:1px solid transparent;cursor:pointer;transition:transform .25s ease, box-shadow .25s ease, background .25s ease}
  .btn-primary{background:var(--accent-grad);color:#fff;box-shadow:0 18px 42px -18px rgba(99,102,241,1)}
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 26px 54px -18px rgba(99,102,241,1)}
  .btn-ghost{background:rgba(255,255,255,.05);border-color:var(--border);color:var(--text)}
  .btn-ghost:hover{transform:translateY(-3px);background:rgba(255,255,255,.08)}
  .hint{margin-top:34px;font-size:.82rem;color:var(--muted-2)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark" aria-hidden="true">SS</div>
    <span class="code">Error 404</span>
    <h1>This route goes <span class="grad-text">nowhere.</span></h1>
    <p>The page you're after doesn't exist, or it moved. Broken link, or a typo somewhere.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Back to home</a>
      <a href="/#contact" class="btn btn-ghost">Contact me</a>
    </div>
    <p class="hint">Shiv Shankar — IT Infrastructure &amp; Automation Professional</p>
  </div>
</body>
</html>
